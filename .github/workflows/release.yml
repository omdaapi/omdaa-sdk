name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VER="${TAG#v}"
          python3 - "$VER" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"## \[{re.escape(ver)}\].*?(?=\n## |\Z)"
          m = re.search(pat, text, re.S)
          body = m.group(0).strip() if m else f"Release {ver}\n\nSee CHANGELOG.md"
          body += "\n\nLanding: https://omdaa.com/mcp\n"
          pathlib.Path("/tmp/release-body.md").write_text(body, encoding="utf-8")
          print(body[:240])
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "Omdaa SDK / Cursor MCP ${TAG}" \
            --notes-file /tmp/release-body.md
